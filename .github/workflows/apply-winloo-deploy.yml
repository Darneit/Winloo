name: Apply Winloo deploy bundle

on:
  push:
    branches: [main]
    paths:
      - winloo-deploy-bundle.zip

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply website bundle
        run: |
          unzip -o winloo-deploy-bundle.zip -d .
          rm -f winloo-deploy-bundle.zip
      - name: Commit deployed site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Apply complete Winloo website bundle"
          git push origin HEAD:main
